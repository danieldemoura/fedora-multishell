# ==============================================================================
# fedora-multi-shell: Configurações Globais
# ==============================================================================

# Caminho do arquivo de log da instalação.
# Fixado no estado do usuário (XDG_STATE_HOME) em vez de /tmp: diretórios
# temporários compartilhados são sujeitos a ataques de symlink. Pode ser
# sobrescrito exportando LOG_FILE antes de invocar o instalador.
: "${LOG_FILE:=${XDG_STATE_HOME:-${HOME:-/tmp}/.local/state}/fedora-multi-shell/install.log}"

# Versão do Fedora homologada para este instalador (verificada em runtime
# por install.sh; divergências geram aviso interativo, não bloqueio cego).
TARGET_FEDORA_VERSION="44"

# Repositórios externos (URLs consumidas por modules/00_repos.sh e
# modules/03_desktop_apps.sh — única fonte de verdade para esses valores).
REPO_BRAVE_URL="https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo"
REPO_FLATHUB_URL="https://dl.flathub.org/repo/flathub.flatpakrepo"
# '$releasever' é intencionalmente preservado (expansão feita pelo DNF).
REPO_TERRA_URL='https://repos.fyralabs.com/terra$releasever'

# Flags de instalação padrão (não sobrescrevem o ambiente se já exportadas)
: "${IS_VM:=false}"
: "${INSTALL_NVIDIA:=false}"
: "${KEYBOARD_ABNT2:=true}"

# Caminho dos diretórios internos do instalador
INSTALLER_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
CONFIG_DIR="${INSTALLER_ROOT}/config"
PACKAGES_DIR="${CONFIG_DIR}/packages"
DESKTOP_DIR="${CONFIG_DIR}/desktop"
SYSTEM_DIR="${CONFIG_DIR}/system"
